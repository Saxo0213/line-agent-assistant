appId: tw.lineagent.assistant
productName: LINE Agent Assistant
copyright: Copyright © 2026 LINE Agent Assistant contributors
asar: true
compression: maximum
asarUnpack:
  - dist/js-external-reader/**/*
  - dist/mcp-stdio-bridge.js
npmRebuild: false
electronLanguages:
  - en-US
  - zh-TW
  - zh-CN
  - ja
  - ko
publish:
  - provider: github
    owner: Saxo0213
    repo: line-agent-assistant
    releaseType: release
directories:
  app: apps/desktop
  output: release
files:
  - dist/**/*
  - assets/icons/*
  - package.json
  - '!**/*.map'
  - '!**/ltsm.wasm'
  - '!**/ltsmSandbox.js'
  - '!**/line-chrome/ltsm{,/**/*}'
  - '!node_modules{,/**/*}'
electronFuses:
  runAsNode: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
extraResources:
  - from: .packaging/resources
    to: .
    filter:
      - '**/*'
      - '!**/ltsm.wasm'
      - '!**/ltsmSandbox.js'
      - '!**/line-chrome/ltsm{,/**/*}'
win:
  executableName: LINE Agent Assistant
  icon: apps/desktop/assets/icons/line-agent-spring.ico
  target:
    - target: nsis
      arch:
        - x64
  requestedExecutionLevel: asInvoker
nsis:
  artifactName: ${productName}-${version}-Setup-${arch}.${ext}
  include: build/installer.nsh
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
