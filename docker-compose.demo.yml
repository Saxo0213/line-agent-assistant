services:
  postgres-demo:
    image: postgres:16
    environment:
      POSTGRES_DB: line_agent_demo
      POSTGRES_USER: line_agent_demo
      POSTGRES_PASSWORD: line_agent_demo_only
    ports:
      - "127.0.0.1:55433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U line_agent_demo -d line_agent_demo"]
      interval: 2s
      timeout: 2s
      retries: 20
