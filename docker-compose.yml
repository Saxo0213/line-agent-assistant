services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: line_agent
      POSTGRES_USER: line_agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-line_agent_dev}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - line_agent_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U line_agent -d line_agent"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  line_agent_postgres:
